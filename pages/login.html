<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <title>login</title>
</head>
<body class="login">
    <div class="auth-card">

        <img class="img-logo-login" src="/assets/logo/logo-rc-160.png" alt="Logo Rui Conecti">
        <h1>Login</h1>

        <label class="auth-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="text" id="email" placeholder="Usuário ou Email">
        </label>

        <label class="auth-field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="senha" placeholder="Senha">
        </label>

        <div class="auth-actions">
            <span class="auth-link">Esqueceu sua senha?</span>
        </div>

        <div class="auth-actions auth-actions--center">
            <button type="submit" id="btn-entrar" class="auth-btn">Entrar</button>
        </div>
        
        <div class="social-login">
    <button type="button" class="social-btn google-btn">
        <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"/>
            <path fill="#34A853" d="M12 21.99c2.63 0 4.84-.87 6.45-2.54l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.99z"/>
            <path fill="#FBBC05" d="M6.54 13.9A5.86 5.86 0 0 1 6.24 12c0-.66.11-1.3.3-1.9V7.57H3.3A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.43l3.24-2.53z"/>
            <path fill="#EA4335" d="M12 6.07c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.83 3.08 14.63 2 12 2a9.74 9.74 0 0 0-8.7 5.57l3.24 2.53C7.31 7.79 9.46 6.07 12 6.07z"/>
        </svg>
    </button>


    <button type="button" class="social-btn apple-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.95-2.53 4.08zM12.03 7.25C11.88 5.02 13.69 3.18 15.76 3c.29 2.58-2.34 4.51-3.73 4.25z"/>
        </svg>
    </button>

        </div>

        <p class="auth-footer">
            Ainda não tem uma conta?
            <a href="cadastro.html" id="link-cadastro">Cadastre-se</a>
        </p>
    </div>

    <script src="/js/auth.js"></script>
</body>
</html>
